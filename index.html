function show(n){

}
function renderStudentInfo(){
 const values={infoGrade:grade.value,infoClass:classNo.value,infoNumber:number.value,infoName:studentName.value.trim()};
 Object.entries(values).forEach(([id,value])=>document.getElementById(id).textContent=value);
}
function next1(){
 if(!grade.value||!classNo.value||!number.value||!studentName.value.trim()) return toast('학년, 반, 번호, 이름을 모두 입력해주세요.');
 show(2);
}
function setMode(m){
 mode=m;
 const img=document.getElementById('p2img'), p=document.getElementById('p2');
 if(m==='solo'){
   img.src=IMG.p2solo;p.classList.remove('team-mode');
   document.querySelectorAll('.friendNo,.friendName').forEach(x=>x.style.display='none');
 }else{
   img.src=IMG.p2team;p.classList.add('team-mode');
   document.querySelectorAll('.friendNo,.friendName').forEach(x=>x.style.display='block');
 }
}
const selectedMonths={dom:3,world:1};
function next2(){show(3)}
function setHolidayTab(t){if(t!==tab){tab=t;renderHolidayHits()}}
function moveMonth(direction){selectedMonths[tab]=Math.max(1,Math.min(12,selectedMonths[tab]+direction));renderHolidayHits()}
function updateHolidaySelection(){
 const summary=document.getElementById('holidaySelection');summary.replaceChildren();
 if(holiday){const label=document.createElement('span');label.textContent='선택한 기념일';const value=document.createElement('strong');value.textContent=`[${holiday.kind}] ${holiday.date} · ${holiday.name}`;summary.append(label,value)}
 else summary.textContent='아직 선택한 기념일이 없습니다.';
 document.querySelectorAll('.holiday-row').forEach(button=>{const selected=!!holiday&&button.dataset.kind===holiday.kind&&button.dataset.date===holiday.date&&button.dataset.name===holiday.name;button.setAttribute('aria-pressed',String(selected));button.querySelector('.mark').textContent=selected?'✓':''});
}
function renderHolidayHits(){
 const month=selectedMonths[tab],list=(tab==='dom'?DOMESTIC:WORLD).filter(([date])=>parseInt(date,10)===month),kind=tab==='dom'?'국내':'세계';
 document.getElementById('domTab').setAttribute('aria-selected',String(tab==='dom'));
 document.getElementById('worldTab').setAttribute('aria-selected',String(tab==='world'));
 document.getElementById('monthTitle').textContent=`${month}월`;
 document.getElementById('monthCount').textContent=`${kind} 기념일 ${list.length}개`;
 document.getElementById('prevMonth').disabled=month===1;
 document.getElementById('nextMonth').disabled=month===12;
 const months=document.getElementById('holidayMonths');months.replaceChildren();
 for(let m=1;m<=12;m++){const button=document.createElement('button');button.textContent=`${m}월`;button.setAttribute('aria-current',String(m===month));button.onclick=()=>{selectedMonths[tab]=m;renderHolidayHits()};months.appendChild(button)}
 months.children[month-1].scrollIntoView({block:'nearest',inline:'nearest'});
 const holder=document.getElementById('holidayList');holder.replaceChildren();
 if(!list.length){const empty=document.createElement('p');empty.className='holiday-empty';empty.textContent='이번 달에는 등록된 기념일이 없습니다.';holder.appendChild(empty)}
 list.forEach(([date,name])=>{const button=document.createElement('button');button.className='holiday-row';button.type='button';Object.assign(button.dataset,{date,name,kind});const dateLabel=document.createElement('span');dateLabel.className='date';dateLabel.textContent=date;const title=document.createElement('span');title.className='title';title.textContent=name;const mark=document.createElement('span');mark.className='mark';mark.setAttribute('aria-hidden','true');button.append(dateLabel,title,mark);button.onclick=()=>{holiday={date,name,kind};updateHolidaySelection()};holder.appendChild(button)});
 updateHolidaySelection();
}
function next3(){if(!holiday)return toast('기념일을 하나 선택해주세요.');show(4)}
function chooseType(el){
 document.querySelectorAll('#p4 .choice').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});el.classList.add('selected');el.setAttribute('aria-pressed','true');makeType=el.dataset.type;
}
function next4(){if(!makeType)return toast('제작 유형을 선택해주세요.');show(5)}
function renderSummary(){
 document.getElementById('sumMe').textContent=`${grade.value} ${classNo.value} ${number.value} ${studentName.value.trim()}`;
 document.getElementById('sumMode').textContent=mode==='solo'?'개인 활동':'팀 활동';
 const fn=[...document.querySelectorAll('.friendName')].map((x,i)=>({name:x.value.trim(),no:document.querySelectorAll('.friendNo')[i].value})).filter(x=>x.name||x.no);
 document.getElementById('sumFriends').textContent=mode==='solo'?'해당 없음':(fn.length?fn.map(x=>`${x.no} ${x.name}`.trim()).join(', '):'팀원 미입력');
 document.getElementById('sumHoliday').textContent=holiday?`${holiday.date} ${holiday.name}`:'';
 document.getElementById('sumType').textContent=makeType||'';
}
function submitDemo(){toast('현재는 디자인 기반 HTML 프로토타입입니다. 다음 단계에서 구글시트와 연결할 수 있어요.')}
setMode('team');
</script>
